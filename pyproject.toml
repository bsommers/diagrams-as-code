[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagrams-as-code"
version = "0.8.4"
description = "Pure-Python directed diagrams as code framework with Manhattan routing and living BOM documentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Bill Sommers" }
]
keywords = ["diagrams", "iiot", "svg", "architecture", "diagrams-as-code", "manhattan-routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
diagrams-as-code = "diagrams_as_code.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "resvg-py>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/diagrams_as_code", "src/iiot_diagrams"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
