name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - ".planning/**"
      - ".claude/**"
      - ".cursor/**"
      - ".superpowers/**"
      - ".issues/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - ".planning/**"
      - ".claude/**"
      - ".cursor/**"
      - ".superpowers/**"
      - ".issues/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run test suite
        run: uv run pytest

      - name: Run evaluation and benchmark suite
        run: uv run python tools/eval_bezier.py

      - name: Verify diagram generation
        run: uv run python main.py

      - name: Verify generated artifacts are committed and current
        run: |
          uv run python tools/generate_icons.py --check
          # main.py and the generators must never rewrite a tracked, hand-
          # maintained file. README.md used to be clobbered by main.py, which
          # silently reverted every edit made to it.
          git diff --exit-code -- README.md docs/ icons/
          # The "Run test suite" step executes every example with cwd=<repo
          # root>, so it has already re-rendered all 84 diagrams in place. The
          # committed SVG and BOM markdown must therefore match what this
          # commit's engine emits; both are byte-identical across Python
          # 3.10-3.13. Rendered PNGs are gitignored and so never appear here:
          # their bytes depend on which rasterizer backend is installed.
          git diff --exit-code -- output/

  docker:
    name: Docker Container Build & Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image with uv
        run: docker build -t iiot-diagrams:latest .

      - name: Run container diagram generation
        run: docker run --rm -v ${{ github.workspace }}/output:/app/output iiot-diagrams:latest
