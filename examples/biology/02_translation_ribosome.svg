  <g id="caption_50">
    <text x="60" y="597.53" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" font-weight="700" textLength="74.17" lengthAdjust="spacingAndGlyphs">FIGURE 2:</text>
    <text x="134.17" y="597.53" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="1132.61" lengthAdjust="spacingAndGlyphs"> TRANSLATION. CHARGED TRNAS PAIR THEIR ANTICODONS WITH MRNA CODONS IN THE A SITE, THE RIBOSOME CATALYSES PEPTIDE-BOND FORMATION</text>
    <text x="365.43" y="616.28" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="595.91" lengthAdjust="spacingAndGlyphs">AND THEN ADVANCES ONE CODON; THE EMPTY TRNA LEAVES FROM THE E SITE</text>
