    <text x="372.07" y="521.63" xml:space="preserve" fill="#333333" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12" textLength="417.75" lengthAdjust="spacingAndGlyphs">  A aminoacyl (incoming charged tRNA)  |  P peptidyl (holds the chain)  |  E exit</text>
    <text x="343.39" y="536.63" fill="#333333" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start">Anticodons are drawn 3&#x27; to 5&#x27; so they pair base for base under the codons.</text>
    <text x="343.39" y="551.63" fill="#333333" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start">Codons: AUG Met, GCU Ala, UGG Trp, GAA Glu.</text>
