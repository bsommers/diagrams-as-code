  <g id="caption_70">
    <text x="60" y="592.53" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" font-weight="700" textLength="74.17" lengthAdjust="spacingAndGlyphs">FIGURE 1:</text>
    <text x="134.17" y="592.53" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="1310.93" lengthAdjust="spacingAndGlyphs"> THE CENTRAL DOGMA ON ONE THREE-CODON GENE. THE MRNA IS COMPLEMENTARY TO THE TEMPLATE STRAND, SO IT MATCHES THE CODING STRAND WITH U IN PLACE OF T;</text>
    <text x="478.77" y="611.28" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="547.56" lengthAdjust="spacingAndGlyphs">EACH CODON SPECIFIES ONE AMINO ACID (AUG MET, GCU ALA, UGG TRP)</text>
  </g>
