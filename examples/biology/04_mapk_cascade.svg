    <text x="134.17" y="829.41" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="1002.69" lengthAdjust="spacingAndGlyphs"> THE MAPK CASCADE: A THREE-KINASE RELAY (RAF, MEK, ERK) AMPLIFIES A RECEPTOR SIGNAL INTO A TRANSCRIPTIONAL RESPONSE.</text>
    <text x="161.09" y="848.16" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="874.69" lengthAdjust="spacingAndGlyphs">RED BAR-HEADED LINES MARK INHIBITION BY A GAP, DRUGS, A PHOSPHATASE AND ERK&#x27;S OWN NEGATIVE FEEDBACK</text>
