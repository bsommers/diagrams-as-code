  <g id="text_31">
    <text x="580" y="547.63" text-anchor="start" fill="#333333" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12"><tspan x="580" dy="0">The other ~90% of each level&#x27;s energy is lost as heat from respiration, as waste, or stays uneaten,</tspan> <tspan x="580" dy="15">so food chains rarely exceed four or five trophic levels.</tspan></text>
  </g>
  <g id="caption_32">
    <text x="43.59" y="608.53" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" font-weight="700" textLength="74.17" lengthAdjust="spacingAndGlyphs">FIGURE 7:</text>
    <text x="117.76" y="608.53" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="1020.92" lengthAdjust="spacingAndGlyphs"> A GRASSLAND FOOD WEB (ARROWS RUN FROM FOOD TO EATER) AND ITS ENERGY PYRAMID. EACH TIER HOLDS ABOUT A TENTH OF THE</text>
    <text x="233.99" y="627.28" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="714.27" lengthAdjust="spacingAndGlyphs">ENERGY OF THE ONE BELOW, SO TOP PREDATORS ARE FEW; THE NUMBERS ARE ILLUSTRATIVE</text>
