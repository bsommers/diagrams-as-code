  <g id="text_61">
    <text x="750" y="474.47" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">receiving flask: distillate</text>
  </g>
  <g id="text_62">
    <text x="239.65" y="215.63" fill="#9C2F2F" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12" text-anchor="start">vapour</text>
  </g>
  <g id="text_63">
    <text x="690" y="122.6" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">How it works</text>
    <text x="690" y="138.85" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">The mixture is heated to its boiling point. The more</text>
    <text x="690" y="155.1" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">volatile component evaporates first, passes through the</text>
    <text x="690" y="171.35" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">side arm, condenses in the cooled tube and drips into</text>
    <text x="690" y="187.6" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">the receiver. The thermometer reads the vapour</text>
    <text x="690" y="203.85" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">temperature, which holds steady while one</text>
    <text x="690" y="220.1" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">component distils.</text>
  </g>
  <g id="text_64">
    <text x="690" y="272.6" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">Good practice</text>
    <text x="690" y="288.85" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">Water in at the low end, so the jacket stays full.</text>
    <text x="690" y="305.1" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">Never heat a closed system: vent the receiver.</text>
    <text x="690" y="321.35" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">Simple distillation needs boiling points about</text>
    <text x="690" y="337.6" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">25 K apart or more; otherwise use a</text>
    <text x="690" y="353.85" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start">fractionating column.</text>
  </g>
  <g id="caption_65">
    <text x="31.33" y="602.55" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" font-weight="700" textLength="74.17" lengthAdjust="spacingAndGlyphs">FIGURE 7:</text>
    <text x="105.51" y="602.55" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="911.84" lengthAdjust="spacingAndGlyphs"> SIMPLE DISTILLATION APPARATUS: BOILING FLASK, STILL HEAD WITH THERMOMETER, LIEBIG CONDENSER AND RECEIVER</text>
  </g>
