  <g id="caption_72">
    <text x="113.37" y="631.03" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" font-weight="700" textLength="74.17" lengthAdjust="spacingAndGlyphs">FIGURE 1:</text>
    <text x="187.54" y="631.03" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="742.59" lengthAdjust="spacingAndGlyphs"> ANTERIOR VIEW OF THE HEART. DEOXYGENATED BLOOD ENTERS THE RIGHT ATRIUM, PASSES THE</text>
    <text x="60" y="649.78" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="923.5" lengthAdjust="spacingAndGlyphs">TRICUSPID VALVE TO THE RIGHT VENTRICLE AND LEAVES BY THE PULMONARY ARTERY; OXYGENATED BLOOD RETURNS TO</text>
    <text x="141.26" y="668.53" xml:space="preserve" fill="#000000" font-family="'STIX Two Text', 'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" textLength="760.97" lengthAdjust="spacingAndGlyphs">THE LEFT ATRIUM, CROSSES THE MITRAL VALVE TO THE LEFT VENTRICLE AND LEAVES BY THE AORTA</text>
  </g>
