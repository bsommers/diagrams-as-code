  <g id="text_22">
    <text x="50" y="472.53" text-anchor="start" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12"><tspan x="50" dy="0">Amber columns are the join key (customer_id = id). The join does not copy customer_id into the mart,</tspan> <tspan x="50" dy="16.8">but it decides which country each order gets, so it is lineage for country (a filter/join dependency).</tspan> <tspan x="50" dy="16.8">A change to raw.orders.amount_cents therefore reaches only revenue_usd, not order_count or country.</tspan></text>
  </g>
