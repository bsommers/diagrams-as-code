  </g>
  <g id="text_81">
    <text x="40" y="547.53" text-anchor="start" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12"><tspan x="40" dy="0">Why re-running is safe: each task writes only its own date partition, replacing it as one unit (an atomic</tspan> <tspan x="40" dy="16.8">partition swap or a transaction), and reads a fixed event_date range, never now(). The same input gives the</tspan> <tspan x="40" dy="16.8">same partition however many times the task runs. A plain INSERT would double the counts on every retry.</tspan></text>
  </g>
</svg>