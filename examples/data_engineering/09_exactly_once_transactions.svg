  <g id="text_8">
    <text x="40" y="572.53" text-anchor="start" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12"><tspan x="40" dy="0">If the task crashes before step 4, the coordinator aborts the transaction: the output records stay invisible</tspan> <tspan x="40" dy="16.8">and the offset is not advanced, so the restarted task re-reads 100 to 109 and produces them once.</tspan> <tspan x="40" dy="16.8">Exactly-once here covers Kafka to Kafka; a side effect outside Kafka needs an idempotent or transactional sink.</tspan></text>
  </g>
