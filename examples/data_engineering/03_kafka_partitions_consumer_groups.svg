  <g id="text_37">
    <text x="40" y="452.53" text-anchor="start" fill="#000000" font-family="Arimo, 'Liberation Sans', Helvetica, Arial, sans-serif" font-size="12"><tspan x="40" dy="0">Yellow cell = log end offset. Each group stores its own committed offset per partition</tspan> <tspan x="40" dy="16.8">in __consumer_offsets, so analytics and billing never affect each other.</tspan> <tspan x="40" dy="16.8">A consumer joining or leaving triggers a rebalance; the member count caps the parallelism at 3.</tspan></text>
